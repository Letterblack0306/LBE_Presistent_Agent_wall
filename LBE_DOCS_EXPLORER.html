<script>
(()=>{
const d=JSON.parse(document.getElementById('data').textContent),tree=document.getElementById('tree'),search=document.getElementById('search'),panel=document.getElementById('references');
document.getElementById('version').textContent='Git snapshot '+d.head;
let active=null;
function allDocs(x){return x.features?x.features.flatMap(g=>g.docs):x.docs||[]}
function select(x,label,button){
document.querySelectorAll('.node.active').forEach(n=>n.classList.remove('active'));
if(button)button.classList.add('active');active={x,label};
document.getElementById('selection').textContent=label;
document.getElementById('description').textContent=x.desc||'Documents first added for this feature within the selected period.';
const docs=allDocs(x);
document.getElementById('refcount').textContent=docs.length+' linked documents';
panel.replaceChildren();
if(!docs.length){panel.textContent='No matching references.';return}
for(const f of docs.sort((a,b)=>a.day.localeCompare(b.day)||a.path.localeCompare(b.path))){
const block=document.createElement('div');block.className='reference';
const link=document.createElement('a');link.className='ref';link.href=f.path;link.textContent=f.path;block.append(link);
const line=document.createElement('div');line.className='tag';line.textContent=f.day+' · '+f.kind;block.append(line);panel.append(block);
}}
function node(title,count,cls,fn){const b=document.createElement('button');b.type='button';b.className='node '+cls;b.textContent=title+' ';const c=document.createElement('span');c.className='count';c.textContent='('+count+')';b.append(c);b.addEventListener('click',()=>fn(b));return b}
function draw(){
const q=search.value.trim().toLowerCase();tree.replaceChildren();let first=null;
for(const phase of d.phases){
const feats=phase.features.map(f=>({...f,docs:q?f.docs.filter(a=>(a.path+' '+f.name+' '+phase.title+' '+a.kind).toLowerCase().includes(q)):f.docs})).filter(f=>f.docs.length);
if(!feats.length)continue;
const wrapper=document.createElement('section');wrapper.className='phase';
const phaseView={...phase,features:feats};const total=feats.reduce((n,f)=>n+f.docs.length,0);
const pb=node(phase.title,total,'phasenode',(b)=>select(phaseView,phase.title,b));wrapper.append(pb);if(!first)first=[phaseView,phase.title,pb];
const branch=document.createElement('div');branch.className='branch';
for(const f of feats){
const part=document.createElement('div');part.className='feature';
const fb=node(f.name,f.docs.length,'featnode',(b)=>select(f,phase.title+' / '+f.name,b));part.append(fb);branch.append(part);
}wrapper.append(branch);tree.append(wrapper);
}
if(first)select(...first);else{panel.textContent='No matching documents.';document.getElementById('refcount').textContent='0 results';}
}
search.addEventListener('input',draw);draw();
})();
</script></body></html>
