[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lbe-guard-inspector-phase1"
version = "0.1.0"
description = "Typed contracts and read-only evidence endpoint for the LBE Guard Inspector"
requires-python = ">=3.11"
dependencies = [
  "jsonschema==4.23.0"
]

[project.optional-dependencies]
test = [
  "pytest==8.3.5"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
