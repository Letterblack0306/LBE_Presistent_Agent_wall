name: v2-release-candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "pyproject.toml"
      - "lbe_guard_inspector/**"
      - "npm/**"
      - ".github/workflows/v2-release-candidate.yml"

permissions:
  contents: read

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install Python build/test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[test]

      - name: Verify V2 Python package version
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          assert data["project"]["name"] == "lbe-guard-inspector"
          assert data["project"]["version"] == "2.0.0"
          print("PYTHON_V2_VERSION=PASS")
          PY

      - name: Run Python suite
        run: python -m pytest -q

      - name: Build Python release artifacts
        run: python -m build

      - name: Verify Python wheel and sdist names
        shell: bash
        run: |
          test -f dist/lbe_guard_inspector-2.0.0-py3-none-any.whl
          test -f dist/lbe_guard_inspector-2.0.0.tar.gz
          echo "PYTHON_V2_ARTIFACTS=PASS"

      - name: Run npm bootstrap tests
        working-directory: npm
        run: npm test

      - name: Audit npm V2 tarball
        working-directory: npm
        run: |
          node -e "const p=require('./package.json'); if(p.name!=='@letterblack/lbe'||p.version!=='2.0.0') process.exit(1)"
          npm pack --dry-run --json > npm-pack.json
          node - <<'NODE'
          const fs = require('node:fs');
          const pack = JSON.parse(fs.readFileSync('npm-pack.json','utf8'))[0];
          const expected = [
            'README.md',
            'bin/lbe.js',
            'lib/launcher.js',
            'lib/paths.js',
            'lib/python-discovery.js',
            'lib/runtime-discovery.js',
            'lib/runtime-install.js',
            'package.json'
          ];
          const actual = pack.files.map(x => x.path);
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            console.error({actual, expected});
            process.exit(1);
          }
          console.log('NPM_V2_TARBALL_ALLOWLIST=PASS');
          NODE
          rm npm-pack.json
          npm pack --json

      - name: Upload Python V2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lbe-python-v2.0.0
          path: |
            dist/lbe_guard_inspector-2.0.0-py3-none-any.whl
            dist/lbe_guard_inspector-2.0.0.tar.gz

      - name: Upload npm V2 tarball
        uses: actions/upload-artifact@v4
        with:
          name: lbe-npm-v2.0.0
          path: npm/letterblack-lbe-2.0.0.tgz
