name: lbe-cline-lock-artifact

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lbe-cline-lock-artifact.yml"
      - "lbe_guard_inspector/runtime/cline_worker/package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: lbe_guard_inspector/runtime/cline_worker/package.json
      - name: Generate lock without lifecycle scripts
        working-directory: lbe_guard_inspector/runtime/cline_worker
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify resolved security tree
        working-directory: lbe_guard_inspector/runtime/cline_worker
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm ls dify-ai-provider @ai-sdk/provider-utils undici --all
          node - <<'NODE'
          const p = require('./package-lock.json');
          const rows = Object.entries(p.packages || {})
            .filter(([k]) => k.endsWith('/undici'))
            .map(([path, v]) => ({ path, version: v.version }));
          console.log(JSON.stringify(rows, null, 2));
          const bad = rows.filter(({version}) => {
            const m = /^(\d+)\.(\d+)\.(\d+)/.exec(version || '');
            if (!m) return true;
            const [major, minor, patch] = m.slice(1).map(Number);
            return major < 6 || (major === 6 && (minor < 27 || (minor === 27 && patch === 0)));
          });
          if (bad.length) {
            console.error('AFFECTED_UNDICI_RESOLUTION', JSON.stringify(bad));
            process.exit(9);
          }
          NODE
      - name: Upload canonical lock candidate
        uses: actions/upload-artifact@v4
        with:
          name: lbe-cline-worker-package-lock
          path: lbe_guard_inspector/runtime/cline_worker/package-lock.json
          if-no-files-found: error
          retention-days: 1
